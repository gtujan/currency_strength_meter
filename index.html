<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CSM Live</title>
<style>
:root{--bg:#12161e;--card:#1a202b;--line:#2a3344;--tx:#d8dee9;--dim:#7b879c;--buy:#3ddc84;--sell:#ff6b5b;--wait:#9aa5b8;--gold:#f5c542}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:clamp(13px,1.1vw + 9px,16px)/1.4 ui-monospace,Menlo,Consolas,monospace;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px clamp(10px,2vw,24px);border-bottom:1px solid var(--line)}
h1{font-size:1.07em;margin:0;color:var(--gold);letter-spacing:.05em}
#status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim)}
#dot{width:10px;height:10px;border-radius:50%;background:#555}
#dot.ok{background:var(--buy)}#dot.stale{background:var(--sell)}
main{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:clamp(10px,1.6vw,20px);padding:clamp(10px,2vw,24px);max-width:1600px;margin:0 auto}
.card{min-width:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{min-width:560px}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
td,th{white-space:nowrap}
@media(max-width:900px){main{grid-template-columns:1fr}
 #curs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));column-gap:20px}}
@media(max-width:480px){.cur{grid-template-columns:40px 1fr 38px}.tag[style]{margin-left:48px!important}td,th{padding:6px 6px}#srv{order:3;width:100%}}
@media(pointer:coarse){button{min-height:38px;padding:6px 14px}th{padding-top:10px;padding-bottom:10px}td{padding-top:8px;padding-bottom:8px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
h2{font-size:12px;color:var(--gold);margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em}
.cur{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:5px 0}
.bar{height:clamp(14px,1.4vw,18px);background:#0e1219;border-radius:3px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .4s,background .4s}
.bar b{position:absolute;top:0;bottom:0;width:1px;background:#556}
.tag{font-size:10px;color:var(--dim)}
table{width:100%;border-collapse:collapse}
th{font-size:.8em;color:var(--dim);text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
td{padding:4px 8px;text-align:right;border-bottom:1px solid #20283a;transition:background .4s}
tr.BUY td{color:var(--buy)}tr.SELL td{color:var(--sell)}tr.WAIT td{color:var(--wait)}
.pill{padding:1px 6px;border-radius:9px;font-size:11px}
.FRESH{background:#1f4d33;color:var(--buy)}.FADING{background:#52301f;color:#ffb066}
.HIGH{color:var(--sell)}.LOW{color:var(--buy)}
.mid{color:var(--dim)}
#filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
button{background:#0e1219;color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:3px 10px;cursor:pointer;font:inherit}
button.on{border-color:var(--gold);color:var(--gold)}
</style></head><body>
<header><h1>CSM LIVE</h1><span id="srv" class="tag"></span>
<div id="status"><span id="age">waiting for feed…</span><span id="dot"></span></div></header>
<main>
 <section class="card"><h2>Currency strength</h2><div id="curs"></div></section>
 <section class="card"><h2>Pairs (sorted by |delta|)</h2>
  <div id="filter"></div>
  <div class="scroll"><table><thead><tr id="thead"></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script>
const cols=[["pair","PAIR"],["buy","BUY%"],["sell","SELL%"],["delta","Δ"],["signal","SIGNAL"],["state","STATE"],["day","DAY"],["mid","PRICE"]];
let snap=null,lastRx=0,sortKey="absdelta",sortDir=-1,flt="ALL";
const $=id=>document.getElementById(id);
$("thead").innerHTML=cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("");
$("thead").onclick=e=>{const k=e.target.dataset.k;if(!k)return;
  if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==="pair"||k==="signal"||k==="state"||k==="day")?1:-1}render()};
$("filter").innerHTML=["ALL","BUY","SELL","WAIT"].map(f=>`<button data-f="${f}" class="${f==="ALL"?"on":""}">${f}</button>`).join("");
$("filter").onclick=e=>{const f=e.target.dataset.f;if(!f)return;flt=f;
  [...$("filter").children].forEach(b=>b.classList.toggle("on",b.dataset.f===f));render()};

function render(){
  if(!snap)return;
  const c=snap.cfg;
  $("srv").textContent=snap.server+" · "+snap.time;
  const curs=[...snap.currencies].sort((a,b)=>b.strength-a.strength);
  $("curs").innerHTML=curs.map(x=>{
    const col=x.strength>=c.strongCut?"var(--buy)":x.strength<=c.weakCut?"var(--sell)":"var(--wait)";
    const tag=x.strength>=c.strongCut?"STRONG":x.strength<=c.weakCut?"WEAK":"";
    return `<div><div class="cur"><span>${x.code}</span><div class="bar"><i style="width:${x.strength*10}%;background:${col}"></i><b style="left:50%"></b></div><span style="color:${col}">${x.strength.toFixed(1)}</span></div>${tag?`<div class="tag" style="margin:-3px 0 0 52px">${tag}</div>`:""}</div>`}).join("");
  let p=snap.pairs.map(x=>({...x,absdelta:Math.abs(x.delta)})).filter(x=>flt==="ALL"||x.signal===flt);
  p.sort((a,b)=>{const A=a[sortKey],B=b[sortKey];return (A>B?1:A<B?-1:0)*sortDir});
  $("rows").innerHTML=p.map(x=>`<tr class="${x.signal}"><td>${x.pair}</td><td>${x.buy.toFixed(1)}</td><td>${x.sell.toFixed(1)}</td><td>${x.delta.toFixed(1)}</td><td>${x.signal}</td><td>${x.state==="-"?"":`<span class="pill ${x.state}">${x.state}</span>`}</td><td class="${x.day}">${x.day==="HIGH"?"HIGH "+x.high:x.day==="LOW"?"LOW "+x.low:"mid"}</td><td>${x.mid}</td></tr>`).join("");
}
function connect(){
  const es=new EventSource("/stream");
  es.onmessage=e=>{snap=JSON.parse(e.data);lastRx=Date.now();render()};
  es.onerror=()=>{};
}
setInterval(()=>{
  if(!lastRx)return;
  const s=(Date.now()-lastRx)/1000;
  $("age").textContent=s<2?"live":`no data for ${s.toFixed(0)}s`;
  $("dot").className=s<5?"ok":"stale";
},500);
connect();
</script></body></html>
